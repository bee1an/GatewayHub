[package]
name = "gatewayhub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A multi-provider desktop AI gateway."
readme = "./README.md"
rust-version.workspace = true

[[bin]]
name = "gatewayhub"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.0"

[workspace.dependencies]
serde = "1.0.228"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["local-time", "env-filter"] }
tracing-appender = "0.2.5"
home = "0.5.12"
smol = "2.0.2"
uuid = { version = "1.18.0", features = ["v4", "v7"] }
sha2 = "0.10.9"
hostname = "0.4.1"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
axum = { version = "0.8.6", features = ["http2"] }
reqwest = { version = "0.12.24", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "charset",
    "http2",
] }
futures = "0.3.31"
tokio-util = { version = "0.7.18", features = ["rt"] }
async-trait = "0.1.89"
async-stream = "0.3.6"
fastrand = "2.3.0"
regex = "1.12.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
base64 = "0.22.1"
gpui-kit = { version = "0.6.0" }
rust-embed = { version = "8.11.0", default-features = false, features = [
    "compression",
] }
schemars = "1.2.2"
gateway-core = { path = "crates/gateway-core" }

[dependencies]
anyhow = { workspace = true }
gpui-kit = { workspace = true }
rust-embed = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
gateway-core = { workspace = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[package.metadata.bundle]
name = "GatewayHub"
identifier = "dev.gatewayhub.app"
copyright = "Copyright © 2026 bee. All rights reserved."
category = "public.app-category.developer-tools"
osx_minimum_system_version = "12.0"
short_description = "A multi-provider desktop AI gateway."
